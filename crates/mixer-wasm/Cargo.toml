[package]
name = "mixer-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly bindings of mixer-core / mixer-core-v2 for the web front end and the aggregator Worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mixer-core = { path = "../mixer-core" }
mixer-core-v2 = { path = "../mixer-core-v2" }
mixer-prover = { path = "../prover" }
ark-ff = "0.5"
blake2b-ref = "0.3"
serde_json = "1"
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Kept out of the root workspace: nothing here may reach the on-chain builds,
# and the wasm toolchain's dependencies stay out of the root lock file.
[workspace]
