[package]
name = "pool-type-v2"
version = "0.1.0"
edition = "2021"
publish = false
description = "Type script of the mixer pool cell, v2: intent deposits and batches"

[dependencies]
ckb-std = { workspace = true }
mixer-core = { path = "../../crates/mixer-core" }
mixer-core-v2 = { path = "../../crates/mixer-core-v2" }
# Groth16/BN254 verifier of the groth16-ckb project, linked as a library.
# Pinned to a reviewed commit; the project is pre-audit.
verifier-core = { git = "https://github.com/CECILIA-MULANDI/groth16-ckb", rev = "e969ad154ea2c00df57f68238ddfbcbc9ceb1419" }

[features]
# Print the cycle counter at stage boundaries (benchmark builds only).
profile = []
